# 부산대학교 정보컴퓨터공학부 교육과정 조회 MCP 서버 (2026학년도)
# 공용 서버: 클러스터에 1개만 배포하고 모든 수강생이 함께 사용합니다.
# 배포: bash 11_deploy-curriculum-mcp.sh --mcp pnu-cse-curriculum-mcp
# 접속: http://pnu-cse-curriculum-mcp.mcp-servers.svc.cluster.local:8000/mcp
# 출처: 2026교육과정표(컴퓨터공학전공).hwp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pnu-cse-curriculum-mcp-src
  labels:
    app: pnu-cse-curriculum-mcp
data:
  server.py: |
    """부산대학교 교육과정 조회 MCP 서버 (Streamable HTTP)."""
    import json
    import os
    from collections import defaultdict

    from mcp.server.mcpserver import MCPServer
    from mcp.server.transport_security import TransportSecuritySettings

    DATA_FILE = os.environ.get("CURRICULUM_FILE", os.path.join(os.path.dirname(__file__), "curriculum.json"))
    with open(DATA_FILE, encoding="utf-8") as f:
        DATA = json.load(f)

    META = DATA["meta"]
    COURSES = DATA["courses"]
    CATEGORIES = list(dict.fromkeys(c["category"] for c in COURSES))
    TITLE = f"{META['university']} {META['major']} ({META['year']}학년도)"

    mcp = MCPServer(
        name=META["server_name"],
        instructions=(
            f"{TITLE} 교육과정(학년/학기별 개설 과목, 이수구분, 학점, 강의·실습 시간, 졸업기준 학점, "
            "최소·심화·부전공 이수 규칙)을 조회하는 도구입니다. 교육과정에 관한 질문은 추측하지 말고 이 도구로 확인하세요."
        ),
    )


    def _num(x: float) -> str:
        return str(int(x)) if x == int(x) else str(x)


    def _when(c: dict) -> str:
        grade = "전학년" if c["grade"] is None else f"{c['grade']}학년"
        sems = ",".join(f"{s}학기" if isinstance(s, int) else str(s) for s in c["semesters"])
        return f"{grade} {sems}"


    def _fmt(c: dict) -> str:
        marks = []
        if c.get("minimum_major_required"):
            marks.append("최소전공 필수")
        if c.get("minor_required"):
            marks.append("부전공 필수")
        extra = f" | {', '.join(marks)}" if marks else ""
        area = f" | {c['liberal_area']}" if c.get("liberal_area") else ""
        return (f"- {_when(c)} | {c['category']} | {c['name_ko']} ({c['name_en']}) [{c['code']}] | "
                f"{_num(c['credits'])}학점 | 강의 {_num(c['lecture_hours'])}시간, 실습 {_num(c['practice_hours'])}시간"
                f"{area}{extra}")


    def _norm(s: str) -> str:
        return "".join(s.split()).lower()


    def _match(c: dict, grade: int | None, semester: int | None) -> bool:
        # 전학년 과목은 어느 학년 조회에도 포함
        return ((grade is None or c["grade"] is None or c["grade"] == grade)
                and (semester is None or semester in c["semesters"]))


    @mcp.tool()
    def search_courses(keyword: str) -> str:
        """과목명(국문 또는 영문) 또는 교과목 번호로 과목을 찾습니다.
        과목이 몇 학년 몇 학기에 개설되는지, 몇 학점인지, 이수구분이 무엇인지 확인할 때 사용합니다.

        Args:
            keyword: 찾을 과목명 또는 그 일부, 또는 교과목 번호 (예: "딥러닝", "cloud", "CA2001621")
        """
        k = _norm(keyword)
        hits = [c for c in COURSES
                if k in _norm(c["name_ko"]) or k in _norm(c["name_en"]) or k in c["code"].lower()]
        if not hits:
            return f"'{keyword}'(이)가 포함된 과목이 교육과정에 없습니다."
        return f"'{keyword}' 검색 결과 {len(hits)}개 과목:\n" + "\n".join(_fmt(c) for c in hits)


    @mcp.tool()
    def list_courses(grade: int | None = None, semester: int | None = None, category: str | None = None,
                     required_for: str | None = None) -> str:
        """조건에 맞는 과목 목록을 반환합니다. 조건을 생략하면 해당 조건은 전체로 간주합니다.
        '전학년' 개설 과목은 학년 조건과 관계없이 포함됩니다.

        Args:
            grade: 학년 (1~4)
            semester: 학기 (1 또는 2)
            category: 이수구분. 효원핵심교양, 기초교양, 전공기초, 전공필수, 전공선택 중 하나
            required_for: "부전공" 또는 "최소전공" — 해당 과정의 필수 표시(◎, ♤) 과목만 조회
        """
        if category and category not in CATEGORIES:
            return f"알 수 없는 이수구분입니다: {category}. 사용 가능한 값: {', '.join(CATEGORIES)}"
        flag = {"부전공": "minor_required", "최소전공": "minimum_major_required", "복수전공": "minimum_major_required"}
        if required_for and required_for not in flag:
            return "required_for 값은 '부전공' 또는 '최소전공' 중 하나여야 합니다."
        hits = [c for c in COURSES
                if _match(c, grade, semester)
                and (category is None or c["category"] == category)
                and (required_for is None or c.get(flag[required_for]))]
        cond = " ".join(x for x in [f"{grade}학년" if grade else "", f"{semester}학기" if semester else "",
                                    category or "", f"{required_for} 필수" if required_for else ""] if x) or "전체"
        if not hits:
            msg = f"조건({cond})에 맞는 과목이 없습니다."
            if required_for == "최소전공" and not any(c.get("minimum_major_required") for c in COURSES):
                msg += " 이 전공은 최소전공 필수 표시(♤)를 따로 두지 않습니다. get_graduation_requirements로 규칙을 확인하세요."
            return msg
        total = sum(c["credits"] for c in hits)
        return f"조건({cond})에 맞는 과목 {len(hits)}개, 합계 {_num(total)}학점:\n" + "\n".join(_fmt(c) for c in hits)


    @mcp.tool()
    def credit_summary(grade: int | None = None, semester: int | None = None) -> str:
        """개설 과목 수와 학점 합계를 이수구분별로 집계합니다.
        이 값은 개설된 과목의 합계이며 졸업 이수 학점이 아닙니다 (졸업 기준은 get_graduation_requirements).

        Args:
            grade: 학년 (1~4). 생략하면 전체 학년
            semester: 학기 (1 또는 2). 생략하면 전체 학기
        """
        hits = [c for c in COURSES if _match(c, grade, semester)]
        if not hits:
            return "조건에 맞는 과목이 없습니다."
        by = defaultdict(lambda: [0, 0.0])
        for c in hits:
            by[c["category"]][0] += 1
            by[c["category"]][1] += c["credits"]
        scope = " ".join(x for x in [f"{grade}학년" if grade else "", f"{semester}학기" if semester else ""] if x) or "전체"
        lines = [f"{scope}: 총 {len(hits)}개 과목, {_num(sum(c['credits'] for c in hits))}학점 (개설 과목 합계이며 졸업 학점 아님)"]
        lines += [f"- {k}: {by[k][0]}개 과목, {_num(by[k][1])}학점" for k in CATEGORIES if k in by]
        return "\n".join(lines)


    @mcp.tool()
    def get_graduation_requirements() -> str:
        """졸업기준 학점(영역별), 최소전공·심화전공·부전공 이수 규칙, 교양 영역 이수 조건,
        복수전공·부전공·연계전공·교직 이수 학점을 반환합니다.
        '졸업하려면 몇 학점', '부전공 하려면', '심화전공 조건' 같은 질문에 사용합니다.
        """
        r = DATA["requirements"]
        lines = [f"[{TITLE}] 졸업기준 {r['total']}학점", "", "■ 영역별 졸업기준 학점"]
        lines += [f"- {k}: {v}" for k, v in r["by_area"].items()]
        lines += ["", "■ 전공 이수 규칙"] + [f"- {x}" for x in r["major_rules"]]
        lines += ["", "■ 교양 이수 조건"] + [f"- {x}" for x in r["liberal_rules"]]
        for cat in ("효원균형교양", "효원창의교양"):
            areas = [a["area"] for a in DATA["liberal_areas"] if a["category"] == cat]
            lines.append(f"- {cat} 영역: {', '.join(areas)}")
        lines += ["", "■ " + r["other_majors_note"]]
        lines += [f"- {k}: {v}학점" for k, v in r["other_majors"].items()]
        lines += ["", "범례: " + META["legend"]]
        return "\n".join(lines)


    if __name__ == "__main__":
        mcp.run(
            transport="streamable-http",
            host="0.0.0.0",
            port=int(os.environ.get("PORT", "8000")),
            stateless_http=True,
            json_response=True,
            # 클러스터 내부 Service DNS 이름으로 접근하므로 DNS rebinding 보호를 끕니다 (실습용)
            transport_security=TransportSecuritySettings(enable_dns_rebinding_protection=False),
        )
