---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pnu-cse-curriculum-mcp
  labels:
    app: pnu-cse-curriculum-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pnu-cse-curriculum-mcp
  template:
    metadata:
      labels:
        app: pnu-cse-curriculum-mcp
    spec:
      containers:
        - name: server
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["/bin/bash", "-c"]
          args:
            - pip install --no-cache-dir "mcp==2.3.0" && exec python /app/server.py
          env:
            - name: PORT
              value: "8000"
            - name: CURRICULUM_FILE
              value: /app/curriculum.json
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: src
              mountPath: /app
      volumes:
        - name: src
          configMap:
            name: pnu-cse-curriculum-mcp-src
---
apiVersion: v1
kind: Service
metadata:
  name: pnu-cse-curriculum-mcp
  labels:
    app: pnu-cse-curriculum-mcp
spec:
  selector:
    app: pnu-cse-curriculum-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
